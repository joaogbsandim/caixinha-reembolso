<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>Caixinha Reembolso</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <form class="auth-card" id="loginForm">
        <div class="brand-lockup login-brand">
          <img class="brand-logo-large" src="/logo-cobase.png" alt="Cobase Engenharia">
          <div>
            <p class="eyebrow">Cobase</p>
            <h1>Entrar</h1>
          </div>
        </div>
        <label class="field">
          <span>Usuario</span>
          <input name="username" autocomplete="username" placeholder="admin ou colaborador" required>
        </label>
        <label class="field">
          <span>Senha</span>
          <input name="password" type="password" autocomplete="current-password" placeholder="Senha" required>
        </label>
        <p class="form-message" id="loginMessage"></p>
        <button class="button primary full" type="submit">Entrar</button>
      </form>
    </section>

    <div class="app-shell is-hidden" id="appShell" hidden>
      <header class="topbar">
        <div class="topbar-brand">
          <img class="brand-logo-small" src="/logo-cobase.png" alt="Cobase Engenharia">
          <div>
            <p class="eyebrow">Cobase</p>
            <h1>Reembolsos</h1>
          </div>
        </div>
        <div class="userbar">
          <div>
            <strong id="userName">...</strong>
            <span id="userRole">...</span>
          </div>
          <button class="button top-action" id="logoutButton" type="button" title="Sair">Sair</button>
        </div>
      </header>

      <nav class="tabs" aria-label="Areas do sistema">
        <button class="tab is-active employee-only" type="button" data-view="employeeView">
          <span class="icon">+</span>
          Lancar
        </button>
        <button class="tab employee-only" type="button" data-view="reportsView">
          <span class="icon">#</span>
          Em aberto
        </button>
        <button class="tab admin-only" type="button" data-view="adminView">
          <span class="icon">OK</span>
          Gestao
        </button>
        <button class="tab" type="button" data-view="approvedView">
          <span class="icon">✓</span>
          Aprovados
        </button>
      </nav>

      <main>
        <section class="view is-active employee-only" id="employeeView">
          <form class="panel expense-form" id="expenseForm">
            <div class="section-title">
              <h2>Novo comprovante</h2>
              <span id="draftCount">0 itens</span>
            </div>

            <div class="field field-full">
              <label class="button ghost file-button single-file-button">
                Anexar comprovante
                <input id="receiptInput" name="receiptFile" type="file" accept="image/*,application/pdf" required>
              </label>
            </div>
            <div class="receipt-preview" id="receiptPreview">
              <span>Sem foto</span>
            </div>

            <label class="field">
              <span>Fornecedor</span>
              <input name="supplier" placeholder="Ex.: Posto, mercado, loja" required>
            </label>

            <label class="field">
              <span>Data</span>
              <input name="date" type="date" required>
            </label>

            <label class="field">
              <span>Valor</span>
              <input name="amount" inputmode="decimal" placeholder="0,00" required>
            </label>

            <div class="field">
              <span>Empresa</span>
              <div class="select-action">
                <label class="sr-only" for="companySelect">Empresa</label>
                <select id="companySelect" name="company" required></select>
                <button class="icon-button add-catalog" type="button" data-kind="company" title="Adicionar empresa">+</button>
              </div>
            </div>

            <div class="field field-full">
              <span>Obra</span>
              <div class="select-action">
                <label class="sr-only" for="projectSelect">Obra</label>
                <select id="projectSelect" name="project" required></select>
                <button class="icon-button add-catalog" type="button" data-kind="project" title="Adicionar obra">+</button>
              </div>
            </div>

            <label class="field field-full">
              <span>Descricao</span>
              <textarea name="description" rows="3" placeholder="Motivo do gasto" required></textarea>
            </label>

            <div class="actions">
              <button class="button primary" type="submit">
                <span class="icon">+</span>
                Adicionar ao relatorio
              </button>
            </div>
          </form>

          <section class="panel">
            <div class="section-title">
              <h2>Relatorio em aberto</h2>
              <strong id="draftTotal">R$ 0,00</strong>
            </div>
            <div class="list" id="draftList"></div>
            <button class="button success full" id="submitReportButton" type="button">
              Enviar pedido de reembolso
            </button>
          </section>
        </section>

        <section class="view" id="reportsView">
          <section class="panel">
            <div class="section-title">
              <h2>Pedidos em aberto</h2>
              <span id="reportCount">0 em aberto</span>
            </div>
            <div class="list" id="reportList"></div>
          </section>
        </section>

        <section class="view" id="adminView">
          <section class="panel">
            <div class="section-title">
              <h2>Painel de gestao</h2>
              <span>pendentes de conferencia</span>
            </div>
            <div class="list" id="adminList"></div>
          </section>
        </section>

        <section class="view" id="approvedView">
          <section class="panel">
            <div class="section-title">
              <h2>Pedidos aprovados</h2>
              <span id="approvedCount">0 aprovados</span>
            </div>
            <div class="list" id="approvedList"></div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop is-hidden" id="catalogModal" role="dialog" aria-modal="true" aria-labelledby="catalogTitle" hidden>
      <form class="modal-card" id="catalogForm">
        <div class="section-title">
          <h2 id="catalogTitle">Novo cadastro</h2>
          <button class="icon-button" id="catalogCloseButton" type="button" title="Fechar">x</button>
        </div>
        <label class="field">
          <span id="catalogLabel">Nome</span>
          <input id="catalogNameInput" name="name" autocomplete="off" required>
        </label>
        <div class="actions">
          <button class="button ghost" id="catalogCancelButton" type="button">Cancelar</button>
          <button class="button primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
    <div class="modal-backdrop is-hidden" id="decisionModal" role="dialog" aria-modal="true" aria-labelledby="decisionTitle" hidden>
      <form class="modal-card" id="decisionForm">
        <div class="section-title">
          <h2 id="decisionTitle">Motivo</h2>
          <button class="icon-button" id="decisionCloseButton" type="button" title="Fechar">x</button>
        </div>
        <label class="field">
          <span id="decisionLabel">Explique o motivo</span>
          <textarea id="decisionReasonInput" name="reason" rows="4" required></textarea>
        </label>
        <div class="actions">
          <button class="button ghost" id="decisionCancelButton" type="button">Cancelar</button>
          <button class="button primary" type="submit">Confirmar</button>
        </div>
      </form>
    </div>

    <template id="expenseTemplate">
      <article class="item expense-item">
        <img class="thumb" alt="Comprovante">
        <div class="item-body">
          <div class="item-head">
            <strong></strong>
            <span></span>
          </div>
          <p></p>
          <small></small>
        </div>
        <button class="icon-button danger" type="button" title="Remover">x</button>
      </article>
    </template>

    <template id="reportTemplate">
      <article class="item report-item">
        <div class="item-body">
          <div class="item-head">
            <strong></strong>
            <span class="status"></span>
          </div>
          <p></p>
          <small></small>
          <details>
            <summary>Ver comprovantes</summary>
            <div class="report-expenses"></div>
          </details>
        </div>
        <div class="status-actions"></div>
      </article>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
